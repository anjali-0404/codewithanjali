/* ── Setup Flat View fallback ──────────────────────────────────────────────── */
const flatIframe = $('#flat');
flatIframe.srcdoc = PORTFOLIO_CONTENT;

function setFlat(on) {
  document.body.classList.toggle('flat', on);
  $('#mode').textContent = on ? '⬡ 3D Desk' : '⬡ Flat View';
}
$('#mode').onclick = () => setFlat(!document.body.classList.contains('flat'));

/* ── Check WebGL Support ───────────────────────────────────────────────────── */
function webglOK() {
  try {
    const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
  } catch (e) { return false; }
}

if (!webglOK() || typeof THREE === 'undefined') {
  setFlat(true);
  $('#ld').classList.add('done');
  return;
}

/* ── Initialize 3D Scene ──────────────────────────────────────────────────── */
try {
  init3D();
} catch (e) {
  console.error('3D initialization failed, falling back to flat view:', e);
  setFlat(true);
  $('#ld').classList.add('done');
}

function init3D() {
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const SCREEN = { w: 1280, h: 1024 };
  const MON_POS = V(0, 950, 255);
  const MON_ROT = -3 * Math.PI / 180;

  /* Renderers */
  const renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x020810, 0);

  const cssR = new THREE.CSS3DRenderer();
  $('#css').appendChild(cssR.domElement);

  const scene = new THREE.Scene();
  const cssScene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x020810, 40000, 90000);

  const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 10, 900000);
  scene.add(camera);

  function resize() {
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    cssR.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  /* ── Monitor: CSS3D iframe + Screen Mesh ───────────────────────────────── */
  const wrap = document.createElement('div');
  wrap.style.cssText = `width:${SCREEN.w}px;height:${SCREEN.h}px;background:#020810;pointer-events:auto;overflow:hidden;border-radius:4px`;

  const frame = document.createElement('iframe');
  frame.title = 'AnjaliOS';
  frame.id = 'computer-screen';
  frame.style.cssText = `width:${SCREEN.w}px;height:${SCREEN.h}px;border:0;background:#020810;display:block`;
  frame.srcdoc = PORTFOLIO_CONTENT;
  wrap.appendChild(frame);

  const css3d = new THREE.CSS3DObject(wrap);
  css3d.position.copy(MON_POS);
  css3d.rotation.x = MON_ROT;
  cssScene.add(css3d);

  /* Transparent hole in WebGL so CSS3D iframe shows through */
  const hole = new THREE.Mesh(
    new THREE.PlaneGeometry(SCREEN.w, SCREEN.h),
    new THREE.MeshBasicMaterial({ color: 0, opacity: 0, transparent: true, blending: THREE.NoBlending, side: THREE.DoubleSide })
  );
  hole.position.copy(MON_POS);
  hole.rotation.x = MON_ROT;
  scene.add(hole);

  /* ── Procedural Cyber Desk Room ────────────────────────────────────────── */
  const mat = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .7, metalness: .1 }, o));
  const neon = (c) => new THREE.MeshBasicMaterial({ color: c });
  function box(w, h, d, m, x, y, z, parent = scene) {
    const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
    o.position.set(x, y, z);
    parent.add(o);
    return o;
  }
  function cyl(rt, rb, h, m, x, y, z, parent = scene) {
    const o = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 32), m);
    o.position.set(x, y, z);
    parent.add(o);
    return o;
  }

  /* Lighting */
  scene.add(new THREE.AmbientLight(0x556688, 0.7));
  const sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(-5000, 12000, 8000);
  scene.add(sun);
  const spill = new THREE.PointLight(0x00f5ff, 1.2, 10000);
  spill.position.set(0, 1200, 2200);
  scene.add(spill);
  const vio = new THREE.PointLight(0xbf00ff, 0.7, 16000);
  vio.position.set(4000, 3500, -1500);
  scene.add(vio);

  /* Floor & Walls */
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(90000, 90000), mat(0x070a12, { roughness: .9 }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -3210;
  scene.add(floor);

  const grid = new THREE.GridHelper(90000, 60, 0x00f5ff, 0x12304a);
  grid.position.y = -3205;
  grid.material.opacity = 0.3;
  grid.material.transparent = true;
  scene.add(grid);

  const wall = new THREE.Mesh(new THREE.PlaneGeometry(90000, 30000), mat(0x0a1020, { roughness: 1 }));
  wall.position.set(0, 9000, -2700);
  scene.add(wall);

  box(30000, 50, 30, neon(0x00f5ff), 0, 4200, -2660);
  box(30000, 50, 30, neon(0xbf00ff), 0, 3700, -2660);

  /* Desk */
  const wood = mat(0x1a2236, { roughness: .65 });
  const dark = mat(0x10151f, { roughness: .8 });
  const body = mat(0x161b29, { roughness: .5, metalness: .3 });

  box(9600, 140, 4200, wood, 0, -70, 300);
  [[-4600, -1700], [4600, -1700], [-4600, 2200], [4600, 2200]].forEach(p => box(160, 3070, 160, dark, p[0], -1675, p[1]));

  /* Monitor Casing & Bezel */
  const mon = new THREE.Group();
  mon.position.copy(MON_POS);
  mon.rotation.x = MON_ROT;
  scene.add(mon);

  const T = 150, depth = 120;
  box(SCREEN.w + 2 * T, T, depth, body, 0, SCREEN.h / 2 + T / 2, depth / 2 - 20, mon);
  box(SCREEN.w + 2 * T, T, depth, body, 0, -SCREEN.h / 2 - T / 2, depth / 2 - 20, mon);
  box(T, SCREEN.h, depth, body, -SCREEN.w / 2 - T / 2, 0, depth / 2 - 20, mon);
  box(T, SCREEN.h, depth, body, SCREEN.w / 2 + T / 2, 0, depth / 2 - 20, mon);

  box(SCREEN.w + 2 * T - 80, SCREEN.h + 2 * T - 80, 800, body, 0, 0, -440, mon);
  box(800, 700, 400, dark, 0, 0, -1100, mon);
  box(900, 320, 800, dark, 0, 160, -300);
  cyl(520, 620, 40, dark, 0, 20, -300);
  box(60, 20, 10, neon(0x00ff88), SCREEN.w / 2 - 60, -SCREEN.h / 2 - T / 2, depth - 18, mon);

  /* Keyboard & Mouse */
  box(1900, 50, 600, dark, 0, 25, 1250);
  box(1800, 10, 520, mat(0x0d1522), 0, 55, 1250);
  const ms = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), mat(0x1c2438));
  ms.scale.set(120, 50, 190);
  ms.position.set(1500, 35, 1250);
  scene.add(ms);
  box(900, 8, 800, mat(0x0b1a2c), 1500, 4, 1230);

  /* Coffee mug & Speakers */
  cyl(130, 110, 230, mat(0xdfe9f5), -1900, 115, 800);
  [-2200, 2200].forEach(x => {
    box(520, 920, 520, dark, x, 460, -100);
    cyl(160, 160, 20, mat(0x050810), x, 460, 165).rotation.x = Math.PI / 2;
  });

  /* ── Camera Positions & Smooth Interpolation ───────────────────────────── */
  const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

  const K = {
    loading: {
      position: V(0, 1400, 4400),
      focalPoint: MON_POS.clone(),
      update() {}
    },
    idle: {
      position: V(-16000, 10000, 16000),
      focalPoint: V(0, 500, 0),
      origin: V(-16000, 10000, 16000),
      update() {
        const t = performance.now();
        this.position.x = Math.sin((t + 19000) * 0.00007) * this.origin.x;
        this.position.y = Math.sin((t + 1000) * 0.000005) * 3000 + this.origin.y;
      }
    },
    desk: {
      position: V(0, 1400, 4400),
      focalPoint: MON_POS.clone(),
      origin: V(0, 1400, 4400),
      tf: MON_POS.clone(),
      tp: V(0, 1400, 4400),
      update() {
        const w = window.innerWidth, h = window.innerHeight;
        const px = (mouse.x - w / 2) / w;
        const py = (mouse.y - h / 2) / h;
        this.tp.x += (this.origin.x + px * 300 - this.tp.x) * 0.04;
        this.tp.y += (this.origin.y - py * 150 - this.tp.y) * 0.04;
        this.focalPoint.copy(MON_POS);
        this.position.copy(this.tp);
      }
    },
    monitor: {
      position: V(0, 950 + 1500 * Math.sin(MON_ROT), 255 + 1500 * Math.cos(MON_ROT)),
      focalPoint: MON_POS.clone(),
      update() {
        const W = window.innerWidth, H = window.innerHeight;
        const aspect = W / H;
        const halfFovRad = (35 / 2) * Math.PI / 180;
        const tanHalfFov = Math.tan(halfFovRad);
        const distH = SCREEN.h / (2 * tanHalfFov);
        const distW = SCREEN.w / (2 * tanHalfFov * aspect);
        const dist = Math.max(distH, distW) * 1.04;
        this.position.set(
          0,
          MON_POS.y + dist * Math.sin(MON_ROT),
          MON_POS.z + dist * Math.cos(MON_ROT)
        );
        this.focalPoint.copy(MON_POS);
      }
    }
  };

  /* Quintic ease */
  function easeQuint(t) {
    return t < 0.5 ? 16 * t * t * t * t * t : 1 + 16 * (--t) * t * t * t * t;
  }

  const cam = {
    cur: 'loading',
    target: undefined,
    tw: null,
    pos: K.loading.position.clone(),
    foc: K.loading.focalPoint.clone(),

    go(key, dur = 1200, callback) {
      if (this.cur === key || this.target === key) return;
      this.target = key;
      this.cur = undefined;
      K[key].update();
      this.tw = {
        key,
        t0: performance.now(),
        dur,
        p0: this.pos.clone(),
        f0: this.foc.clone(),
        cb: callback
      };
    },

    update(now) {
      for (const k in K) K[k].update();
      if (this.tw) {
        const w = this.tw;
        const kf = K[w.key];
        const t = Math.min((now - w.t0) / w.dur, 1);
        const e = easeQuint(t);
        this.pos.lerpVectors(w.p0, kf.position, e);
        this.foc.lerpVectors(w.f0, kf.focalPoint, e);
        if (t >= 1) {
          this.cur = w.key;
          this.target = undefined;
          const cb = this.tw.cb;
          this.tw = null;
          if (cb) cb();
        }
      } else if (this.cur) {
        this.pos.copy(K[this.cur].position);
        this.foc.copy(K[this.cur].focalPoint);
      }
      camera.position.copy(this.pos);
      camera.lookAt(this.foc);
    }
  };

  /* ── Interaction: Click / Scroll to Zoom ────────────────────────────────── */
  let inMonitor = false;

  function zoomToMonitor() {
    if (inMonitor) return;
    inMonitor = true;
    document.body.classList.add('in-monitor');
    cam.go('monitor', 1400);
  }

  function zoomToDesk() {
    if (!inMonitor) return;
    inMonitor = false;
    document.body.classList.remove('in-monitor');
    cam.go('desk', 1200);
  }

  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  /* Click handler: if at desk or idle, clicking zooms directly into monitor */
  document.addEventListener('pointerdown', e => {
    if (e.target.closest('#hud, #mode, #exit-btn')) return;
    if (inMonitor) return; // Never trigger zoom while viewing monitor
    zoomToMonitor();
  });

  /* Wheel handler: scroll up zooms into monitor from desk; while in monitor, NEVER hijack scroll */
  window.addEventListener('wheel', e => {
    if (inMonitor) return; // Allow natural scrolling inside the iframe through all portfolio sections
    if (e.deltaY < 0) {
      zoomToMonitor();
    }
  }, { passive: true });

  /* Escape key or Exit button zooms back out to desk */
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') zoomToDesk();
  });
  $('#exit-btn').onclick = zoomToDesk;
  $('#hint').onclick = zoomToMonitor;

  /* PostMessage bridge from iframe inside screen */
  window.addEventListener('message', e => {
    if (e.data && e.data.type === 'exit') {
      zoomToDesk();
    }
  });

  /* ── Render Loop ──────────────────────────────────────────────────────── */
  let raf = 0;
  function frameLoop(now) {
    raf = requestAnimationFrame(frameLoop);
    cam.update(now);
    renderer.render(scene, camera);
    cssR.render(cssScene, camera);
  }
  requestAnimationFrame(frameLoop);

  /* ── Boot Complete: Land right in front of computer desk ──────────────── */
  (async () => {
    await sleep(600);
    $('#ld').classList.add('done');
    cam.go('desk', 1800);

    /* Clock */
    const clk = $('#clk');
    const tick = () => clk.textContent = '◷ ' + new Date().toLocaleTimeString();
    tick();
    setInterval(tick, 1000);
  })();
}

})();
</script>
